<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Ibi, mascote da IBCI, pose ler"><style>
.ibi{animation:bob 3.2s ease-in-out infinite;transform-origin:200px 372px;transform-box:view-box}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.01,.99)}}
.eye{animation:blink 4.6s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave{animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.cheer{animation:cheer .7s ease-in-out infinite alternate}
.cheerR{animation:cheerR .7s ease-in-out infinite alternate}
@keyframes cheer{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes cheerR{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}
.jump{animation:jump .7s ease-in-out infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.halo{animation:glow 3.2s ease-in-out infinite;transform-origin:200px 150px;transform-box:view-box}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.conf rect{animation:fall 1.8s ease-in infinite}
.conf rect:nth-child(2n){animation-delay:.5s}.conf rect:nth-child(3n){animation-delay:1s}
@keyframes fall{0%{opacity:0;transform:translateY(-14px)}30%{opacity:1}100%{opacity:0;transform:translateY(20px)}}
.page{animation:flip 2.4s ease-in-out infinite;transform-origin:200px 300px;transform-box:view-box}
@keyframes flip{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
